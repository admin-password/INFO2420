<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rent a Pet - Graphics</title>

<style type="text/css">


	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:500px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "images/print5.gif"
	PrintButton2.src = "images/print6.gif"
	logo1.src = "images/logo1.jpg"
	logo2.src = "images/logo2.jpg"
}


		var imgArray = new Array(
			'image1lg.jpg',
			'image2lg.jpg',
			'image3lg.jpg',
			'image4lg.jpg'
			

		);


		var titleArray = new Array(
			'Angry Fuzzy Cat',
			'Cat and Dog',
			'Parrot and Dog',
			'Two hunting Dogs'
			
		);
			
		var imgPath = "images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">

<div>
	<a href="#"
	   onmouseover="document.getElementById('print').src='images/print2.jpg';"
	   onmouseout="document.getElementById('print').src='images/print1.jpg';">

		<img src="images/print1.jpg"
			 width="200" height="50"
			 id="print" alt="Print Page"
			 style="border:none;" />

	</a>
</div>


<div>
	<a href="logo.html"
	   onmouseover="document.getElementById('logoImage').src='images/logo2.jpg';"
	   onmouseout="document.getElementById('logoImage').src='images/logo1.jpg';">

		<img src="images/logo1.jpg"
			 width="133" height="126"
			 id="logoImage"
			 alt="Logo"
			 style="border:none;" />

	</a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">
		<img src="images/thumbnails/Image1Sm.jpg" alt="Angry Fuzzy Cat" onmouseover="swapImage(0);" />
		<img src="images/thumbnails/Image2Sm.jpg" alt="Cat and Dog" onmouseover="swapImage(1);" />
		<img src="images/thumbnails/Image3Sm.jpg" alt="Parrot and Dog" onmouseover="swapImage(2);" />
		<img src="images/thumbnails/Image4Sm.jpg" alt="Two hunting Dogs" onmouseover="swapImage(3);" />
		
</div>

	<div id="image">

		<img id="theImage" src="images/fullsize/image1lg.jpg" alt="Angry Fuzzy Cat" />
		<h3 id="bottomText">Angry Fuzzy Cat</h3>
	</div>

<img src="images/2colback.jpg">

<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
