<!DOCTYPE html>
<html>


<head>

<meta charset="UTF-8">
	
<title>HTML Practice 6 - Tables</title>

<style type="text/css">

.centerDiv {
  text-align: center;
}

.centerTable {
  margin: auto;
  width: 550px;
}

.scheduleCaption {
  color: #003300;
  font-size: 1.3em;
  font-weight: bold;
  padding-bottom: 10px;
}

.firstCol {
  background-color: #CCCCCC;
  width: 25%;
}

.days {
  width: 15%;
}

.dayHeader {
  background-color: #99FF66;
}

</style>
</head>
<body>
<div class="centerDiv">
   <table class="centerTable" border="1" cellspacing="0" cellpadding="8">

   <caption class="scheduleCaption">My Class Schedule</caption>

   <colgroup class="firstCol"></colgroup>
   <colgroup class="days" span="5"></colgroup>

   <tr>
   <th>Courses</th>
   <th class="dayHeader">Monday</th>
   <th class="dayHeader">Tuesday</th>
   <th class="dayHeader">Wednesday</th>
   <th class="dayHeader">Thursday</th>
   <th class="dayHeader">Friday</th>
   </tr>

   <tr>
   <th>INFO 1120</th>
   <td></td>
   <td>9-11</td>
   <td></td>
   <td>9-11</td>
   <td rowspan="2"></td>
   </tr>

   <tr>
   <th>MATH 1010</th>
   <td colspan="4">12-1</td>
   </tr>

   <tr>
   <th>INFO 2420</th>
   <td colspan="5">Online Available 24/7</td>
   </tr>

   </table>
</div>



</body>
</html>
